name: Pages

# Publishes site/ to GitHub Pages, at https://vibeslop.github.io/Planets/, whenever main
# changes it. The site is plain files, so nothing is built: the folder is the site.

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer push never waits behind an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Check out main
        uses: actions/checkout@v6

      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Package the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
