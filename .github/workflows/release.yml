name: Release

# Builds a version tag's Planets-<version>-macos.zip, signed with the release certificate, and
# attaches it to the tag's release, creating it as a draft when there is none. install.sh installs
# the newest published release that carries one.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  macos:
    # The package needs the macOS 26 SDK and Xcode's actool for the icon.
    runs-on: macos-26
    # The environment holds the release certificate, and admits only v* tags.
    environment: release

    steps:
      - name: Name the tag
        id: tag
        run: |
          tag=$GITHUB_REF_NAME
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$tag is not a version tag such as v1.1.0."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check out the tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - name: Check that the tag names the version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          plist_version=$(plutil -extract CFBundleShortVersionString raw Support/Info.plist)
          if [ "$VERSION" != "$plist_version" ]; then
            echo "::error::Tag v$VERSION does not match version $plist_version in Support/Info.plist."
            exit 1
          fi

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "Planets $VERSION" --notes ""
          fi

      - name: Import the release certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_RELEASE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE" ] || [ -z "$CERTIFICATE_PASSWORD" ]; then
            echo "::error::The release environment lacks the certificate; run scripts/make-signing-cert.sh --release."
            exit 1
          fi
          # A keychain of its own for the key. Its password only has to last the job.
          keychain=$RUNNER_TEMP/release.keychain-db
          keychain_password=$(openssl rand -hex 32)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security import "$RUNNER_TEMP/release.p12" -k "$keychain" -f pkcs12 \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/release.p12"
          # codesign has to reach the key without a prompt, which a runner cannot answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          # codesign on macOS 26 offers only certificates trusted for code signing, and answers
          # "no identity found" for the rest. Trust in the user domain waits for an authorization
          # prompt, so it goes in the admin domain, which takes the passwordless sudo that
          # GitHub's runners allow.
          security find-certificate -c "Planets Release" -p "$keychain" > "$RUNNER_TEMP/release.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/release.pem"
          rm "$RUNNER_TEMP/release.pem"
          # codesign builds the certificate chain from the search list only.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          valid=$(security find-identity -v -p codesigning "$keychain")
          case "$valid" in
            *"$(cat scripts/release-certificate.sha1)"*) ;;
            *)
              echo "::error::The release certificate is not valid for code signing after import:"
              echo "$valid"
              exit 1
              ;;
          esac
          echo "PLANETS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Package
        run: scripts/package.sh

      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: gh release upload "$TAG" "build/Planets-$VERSION-macos.zip" --clobber

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
